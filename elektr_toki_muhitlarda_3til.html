<!DOCTYPE html>
<html lang="uz"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elektr toki turli muhitlarda — Virtual Laboratoriya</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>

@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap');
:root{--bg:#0a0e1a;--panel:#111827;--border:#1e2d45;--accent:#00d4ff;--accent3:#7fff6b;--text:#e2e8f0;--muted:#64748b;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;overflow-x:hidden;}
header{padding:14px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,#0a0e1a,#0d1528);}
.badge{background:var(--accent);color:#000;font-family:'Space Mono',monospace;font-size:10px;font-weight:700;padding:3px 8px;letter-spacing:2px;border-radius:2px;}
header h1{font-size:18px;font-weight:800;color:#fff;}
header h1 span{color:var(--accent);}
.sub{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);margin-left:auto;}
.layout{display:grid;grid-template-columns:300px 1fr 270px;height:calc(100vh - 53px);}
.left,.right{background:var(--panel);padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;}
.left{border-right:1px solid var(--border);}.right{border-left:1px solid var(--border);}
.stitle{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:2px;}
.cg{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:12px;}
.cg label{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:8px;gap:6px;}
.vb{font-family:'Space Mono',monospace;font-size:12px;color:var(--accent);background:rgba(0,212,255,.1);padding:2px 8px;border-radius:4px;min-width:72px;text-align:center;}
input[type=range]{width:100%;-webkit-appearance:none;height:5px;background:var(--border);border-radius:3px;outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;background:var(--accent);border-radius:50%;cursor:pointer;box-shadow:0 0 12px rgba(0,212,255,.8);}
.fbox{background:rgba(0,212,255,.05);border:1px solid rgba(0,212,255,.2);border-radius:8px;padding:12px;}
.fr{display:flex;gap:8px;margin-bottom:6px;font-family:'Space Mono',monospace;font-size:11px;}
.fr:last-child{margin-bottom:0;}.fl{color:var(--muted);min-width:20px;}.fe{color:var(--accent3);}
.btn{width:100%;padding:14px;border:none;border-radius:8px;font-family:'Syne',sans-serif;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;}
#startBtn{background:linear-gradient(135deg,#00d4ff,#0099cc);color:#000;}
#startBtn:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(0,212,255,.5);}
#resetBtn{background:rgba(255,255,255,.07);color:var(--text);border:1px solid var(--border);margin-top:8px;font-size:13px;}
.nt{width:100%;border-collapse:collapse;font-family:'Space Mono',monospace;font-size:10px;}
.nt th{color:var(--accent);font-size:9px;letter-spacing:1px;border-bottom:1px solid var(--border);padding:5px 3px;text-align:left;}
.nt td{padding:4px 3px;border-bottom:1px solid rgba(255,255,255,.04);}
.center{position:relative;overflow:hidden;background:var(--bg);}
#cv{position:absolute;top:0;left:0;width:100%;height:100%;}
.tdisp{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);border:1px solid var(--border);padding:6px 20px;border-radius:20px;font-family:'Space Mono',monospace;font-size:13px;color:var(--accent);white-space:nowrap;z-index:10;pointer-events:none;}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent3);margin-right:6px;animation:bl 1s infinite;vertical-align:middle;}
.dot.off{background:var(--muted);animation:none;}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.2}}
.rc{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:12px;}
.rc.hi{border-color:rgba(0,212,255,.3);background:rgba(0,212,255,.06);}
.rl{font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;}
.rv{font-size:24px;font-weight:800;color:#fff;line-height:1.1;}
.ru{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);margin-top:3px;}
.gt{font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);margin-bottom:4px;letter-spacing:1px;}
.gb{background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:8px;padding:8px;}
.gb canvas{display:block;border-radius:4px;width:100%;}
#startScreen{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 50% 30%,#0d1830,#060910 70%);display:flex;align-items:center;justify-content:center;overflow-y:auto;}
#startScreen .inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:16px;max-width:560px;padding:20px;text-align:center;}
#startScreen .icon{width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,rgba(0,212,255,.18) 0%,rgba(0,212,255,.02) 70%);border:2px solid rgba(0,212,255,.4);display:flex;align-items:center;justify-content:center;box-shadow:0 0 55px rgba(0,212,255,.3);animation:pulseF 2.5s ease-in-out infinite;font-size:44px;}
@keyframes pulseF{0%,100%{box-shadow:0 0 55px rgba(0,212,255,.2)}50%{box-shadow:0 0 80px rgba(0,212,255,.5)}}
@keyframes fadeOutF{0%{opacity:1}100%{opacity:0;transform:scale(1.04)}}
#startScreen h1{font-size:22px;font-weight:800;color:#fff;}#startScreen h1 span{color:var(--accent);}
.formula{font-size:11px;color:var(--muted);font-family:'Space Mono',monospace;}
.order-box{background:rgba(0,212,255,.05);border:1px solid rgba(0,212,255,.15);border-radius:12px;padding:15px;width:100%;text-align:left;}
.order-label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--accent);margin-bottom:8px;}
.order-item{display:flex;align-items:center;gap:8px;font-size:11px;color:#c5d3e8;margin-bottom:7px;}
.order-item:last-child{margin-bottom:0;}
.order-num{width:20px;height:20px;border-radius:50%;background:rgba(0,212,255,.2);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--accent);flex-shrink:0;}
.startlab-btn{background:linear-gradient(135deg,#00d4ff,#0099cc);color:#000;border:none;border-radius:12px;padding:15px 60px;font-size:15px;font-weight:800;font-family:'Syne',sans-serif;cursor:pointer;box-shadow:0 8px 30px rgba(0,212,255,.35);width:100%;}
.lang-btns{display:flex;gap:4px;margin-left:auto;flex-shrink:0;}
.lb{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--muted);font-family:'Space Mono',monospace;font-size:10px;font-weight:700;padding:5px 9px;border-radius:6px;cursor:pointer;user-select:none;}
.lb.on{background:rgba(0,212,255,.12);border-color:var(--accent);color:var(--accent);}
#endScreen{position:fixed;inset:0;z-index:9998;background:radial-gradient(circle at 50% 30%,#0d1830,#060910 70%);display:none;align-items:center;justify-content:center;overflow-y:auto;}
#endScreen.show{display:flex;}
#endScreen .inner{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:480px;padding:24px;text-align:center;animation:fIn .4s ease forwards;}
@keyframes fIn{0%{opacity:0;transform:scale(.96)}100%{opacity:1;transform:scale(1)}}
.checkicon{width:80px;height:80px;border-radius:50%;border:2px solid rgba(127,255,107,.4);display:flex;align-items:center;justify-content:center;box-shadow:0 0 45px rgba(127,255,107,.25);font-size:38px;}
#endScreen h2{font-size:20px;font-weight:800;color:#fff;}
#txtEndResult{font-family:'Space Mono',monospace;font-size:12px;color:var(--accent3);line-height:1.6;}
.qrbox{background:#fff;padding:14px;border-radius:14px;box-shadow:0 8px 30px rgba(0,212,255,.25);}
.qrcap{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:1px;max-width:320px;}
.retry-btn{background:rgba(255,255,255,.07);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:11px 40px;font-size:13px;font-weight:700;font-family:'Syne',sans-serif;cursor:pointer;}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
.nt td,.nt th{white-space:nowrap}
.btn:disabled{opacity:.35;cursor:not-allowed}
#finBtn{background:linear-gradient(135deg,#7fff6b,#3fbf4a);color:#000;margin-top:8px;font-size:13px}
@media(max-width:900px){.layout{grid-template-columns:1fr;height:auto}.center{height:62vh}header{flex-wrap:wrap;padding:10px 14px}.sub{display:none}header h1{font-size:15px}}

.modes{display:flex;gap:6px}
.mt{flex:1;padding:10px 4px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--muted);font-family:'Space Mono',monospace;font-size:11px;font-weight:700;border-radius:6px;cursor:pointer;text-align:center;user-select:none}
.mt.on{border-color:var(--accent);color:var(--accent);background:rgba(0,212,255,.12)}
.hid{display:none!important}
.mg{display:flex;flex-direction:column;gap:12px}
select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px;font-family:'Syne',sans-serif;font-size:13px}
.note{font-size:11px;line-height:1.5;color:#c5d3e8}
</style></head><body>
<div id="startScreen"><div class="inner">
 <div style="display:flex;align-items:center;gap:10px"><div class="badge" data-t="badge">LAB</div><div style="font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:2px" data-t="sub"></div></div>
 <div class="icon">⚡</div>
 <h1><span data-t="startH1"></span><span data-t="startH1S"></span></h1>
 <p class="formula">I = U / R · R = R₀(1 + α·ΔT) · m = k·I·t</p>
 <div class="order-box"><div class="order-label" data-t="orderLabel"></div>
  <div class="order-item"><span class="order-num">1</span><span data-t="ord1"></span></div>
  <div class="order-item"><span class="order-num">2</span><span data-t="ord2"></span></div>
  <div class="order-item"><span class="order-num">3</span><span data-t="ord3"></span></div>
  <div class="order-item"><span class="order-num">4</span><span data-t="ord4"></span></div></div>
 <button class="startlab-btn" onclick="startLab()" data-t="startBtn"></button>
</div></div>
<div id="endScreen"><div class="inner"><div class="checkicon">✅</div><h2 data-t="endTitle"></h2><p id="txtEndResult"></p>
 <div class="qrbox"><div id="qrcodeCanvas"></div></div><div class="qrcap" data-t="endCaption"></div>
 <button class="retry-btn" onclick="hideEnd()" data-t="endRetry"></button></div></div>
<header><div class="badge" data-t="badge">LAB</div>
 <h1><span data-t="hMain"></span><span data-t="hSpan"></span><span data-t="hDash"></span></h1>
 <div class="sub" data-t="sub"></div>
 <div class="lang-btns"><div class="lb on" data-l="uz">🇺🇿 UZ</div><div class="lb" data-l="ru">🇷🇺 RU</div><div class="lb" data-l="en">🇬🇧 EN</div></div></header>
<div class="layout">
 <div class="left">
  <div class="stitle" data-t="left1"></div>
  <div class="modes"><div class="mt on" data-m="0" data-t="m0"></div><div class="mt" data-m="1" data-t="m1"></div><div class="mt" data-m="2" data-t="m2"></div></div>
  <div class="mg" id="mg0">
   <div class="cg"><label><span data-t="lMat"></span></label><select id="mat"><option value="0"></option><option value="1"></option><option value="2"></option></select></div>
   <div class="cg"><label><span data-t="lU"></span><span class="vb" id="d0U"></span></label><input type="range" id="s0U" min="0" max="12" step="0.5" value="6"></div>
   <div class="cg"><label><span data-t="lT"></span><span class="vb" id="d0T"></span></label><input type="range" id="s0T" min="0" max="400" step="5" value="20"></div>
  </div>
  <div class="mg hid" id="mg1">
   <div class="cg"><label><span data-t="lU"></span><span class="vb" id="d1U"></span></label><input type="range" id="s1U" min="0" max="12" step="0.5" value="6"></div>
   <div class="cg"><label><span data-t="lC"></span><span class="vb" id="d1C"></span></label><input type="range" id="s1C" min="0.1" max="1" step="0.05" value="0.5"></div>
  </div>
  <div class="mg hid" id="mg2">
   <div class="cg"><label><span data-t="lU"></span><span class="vb" id="d2U"></span></label><input type="range" id="s2U" min="0" max="500" step="10" value="0"></div>
   <div class="mt on" id="ionB"></div>
  </div>
  <div><div class="stitle" data-t="formulas"></div><div class="fbox" id="fbox"></div></div>
  <button class="btn" id="startBtn">● <span data-t="btnRec"></span></button>
  <button class="btn" id="finBtn" disabled>✔ <span data-t="btnFin"></span></button>
  <button class="btn" id="resetBtn">↺ <span data-t="btnReset"></span></button>
  <div><div class="stitle" data-t="tblT"></div><div class="cg" style="padding:10px;overflow-x:auto"><table class="nt"><thead id="nth"></thead><tbody id="ntb"></tbody></table></div></div>
 </div>
 <div class="center"><canvas id="cv"></canvas><div class="tdisp"><span class="dot" id="dot"></span><span id="tt"></span></div></div>
 <div class="right">
  <div class="stitle" data-t="results"></div>
  <div class="rc hi"><div class="rl" id="rl0"></div><div class="rv" id="rv0">0</div><div class="ru" id="ru0"></div></div>
  <div class="rc"><div class="rl" id="rl1"></div><div class="rv" id="rv1">0</div><div class="ru" id="ru1"></div></div>
  <div class="rc"><div class="rl" id="rl2"></div><div class="rv" id="rv2">—</div><div class="ru" id="ru2"></div></div>
  <div><div class="gt" id="gt"></div><div class="gb"><canvas id="ig" width="230" height="140"></canvas></div></div>
  <div class="fbox note" id="note"></div>
 </div>
</div>
<script>
var LANG='uz',mode=0,rec=[[],[],[]],ph=0,mass=0,tsim=0,ION=true;
var MAT=[{r:10,a:.0043},{r:15,a:.0065},{r:20,a:.00001}],VB=300,KT=.329;
function $(i){return document.getElementById(i);}
var cv=$('cv'),ctx=cv.getContext('2d'),gc=$('ig').getContext('2d');
function rs(){cv.width=cv.offsetWidth;cv.height=cv.offsetHeight;}rs();addEventListener('resize',rs);
function rnd(a){return (Math.random()*2-1)*a;}
function R(a,b){return a+Math.random()*(b-a);}
function f(x,d){var s=x.toFixed(d);return LANG==='en'?s:s.replace('.',',');}
function Ig(U,on){var b=(on?10:.02)*Math.min(1,U/100);return U>=VB?Math.max(b,10)*(1+Math.pow((U-VB)/20,2)):b;}
function gv(){return {U0:+$('s0U').value,TP:+$('s0T').value,m:MAT[+$('mat').value],U1:+$('s1U').value,C:+$('s1C').value,U2:+$('s2U').value};}
function live(){var v=gv(),o={};
 if(mode==0){o.R=v.m.r*(1+v.m.a*(v.TP-20));o.I=v.U0/o.R;}
 else if(mode==1){o.I=v.U1*v.C/20;}
 else{o.I=Ig(v.U2,ION);o.brk=v.U2>=VB;}
 return o;}
function tabv(){return mode==0?MAT[+$('mat').value].a:mode==1?KT:VB;}
function res(){var r=rec[mode],n=r.length;
 if(mode==0){if(n<3)return null;var st=0,sr=0,stt=0,str=0,mn=1e9,mx=-1e9;
  r.forEach(function(o){st+=o.T;sr+=o.R;stt+=o.T*o.T;str+=o.T*o.R;mn=Math.min(mn,o.T);mx=Math.max(mx,o.T);});
  if(mx-mn<50)return null;var sl=(n*str-st*sr)/(n*stt-st*st),ic=(sr-sl*st)/n;return sl/(ic+sl*20);}
 if(mode==1)return n?r.reduce(function(s,o){return s+o.k;},0)/n:null;
 var lo=-1,hi=1e9;r.forEach(function(o){if(o.brk)hi=Math.min(hi,o.U);else lo=Math.max(lo,o.U);});
 return lo>=0&&hi<1e9?(lo+hi)/2:null;}
function fv(x){return mode==0?f(x*1e3,3):mode==1?f(x,3):f(x,0);}
function errS(x){var t=tabv();return (mode==0&&t<1e-3)?'Δ = '+f(Math.abs(x-t)*1e3,3):'δ = '+f(Math.abs(x-t)/t*100,1)+' %';}
function iTxt(I){return I>=1000?[f(I/1000,2),'mA']:[f(I,2),'µA'];}
function upd(){var v=gv(),o=live(),x=res(),u=T('cu')[mode];
 $('d0U').textContent=v.U0+' V';$('d0T').textContent=v.TP+' °C';$('d1U').textContent=v.U1+' V';$('d1C').textContent=f(v.C,2);$('d2U').textContent=v.U2+' V';
 $('ionB').textContent=T(ION?'ionOn':'ionOff');$('ionB').className='mt'+(ION?' on':'');
 var live0;
 if(mode==0){$('tt').textContent='U = '+v.U0+' V · T = '+v.TP+' °C · I = '+f(o.I,2)+' A';
  $('rv0').textContent=f(o.I,3);$('ru0').textContent='A';$('rv1').textContent=f(o.R,2);$('ru1').textContent='Ω';
  $('note').innerHTML=T('i0');live0=o.I>0;}
 else if(mode==1){$('tt').textContent='U = '+v.U1+' V · c = '+f(v.C,2)+' · t = '+Math.floor(tsim)+' s';
  $('rv0').textContent=f(o.I,2);$('ru0').textContent='A';$('rv1').textContent=f(mass,1);$('ru1').textContent=T('mg');
  $('note').innerHTML=T('i1');live0=o.I>0;}
 else{var q=iTxt(o.I),si=v.U2===0?0:o.brk?4:!ION?1:v.U2<100?2:3;
  $('tt').textContent='U = '+v.U2+' V · '+T(ION?'ionOn':'ionOff');
  $('rv0').textContent=q[0];$('ru0').textContent=q[1];$('rv1').textContent=T('dtn')[o.brk?1:(o.I>.1?0:2)];$('ru1').textContent='';
  $('note').innerHTML=T('s')[si]+' '+T('i2e');live0=v.U2>0;}
 $('dot').className='dot'+(live0?'':' off');
 $('rv2').textContent=x===null?'—':fv(x);
 $('ru2').textContent=T('cu')[mode]+(x===null?'':' · '+errS(x));
 $('finBtn').disabled=!(rec[mode].length>=3&&x!==null);}
function table(){var h=[['n','T','I','R'],['n','I','t','m','k'],['n','U','I']][mode];
 $('nth').innerHTML='<tr>'+h.map(function(c){return '<th>'+c+'</th>';}).join('')+'</tr>';
 var tb=$('ntb');tb.innerHTML='';rec[mode].forEach(function(r,i){var c=mode==0?[r.T,f(r.I,3),f(r.R,2)]:mode==1?[f(r.I,2),f(r.t,0),f(r.m,1),f(r.k,3)]:[r.U,f(r.I,r.I<1?2:1)];
  var tr=document.createElement('tr');tr.innerHTML='<td>'+(i+1)+'</td>'+c.map(function(z){return '<td>'+z+'</td>';}).join('');tb.appendChild(tr);});}
function setMode(m){mode=m;
 document.querySelectorAll('.modes .mt').forEach(function(b){b.className='mt'+(+b.dataset.m===m?' on':'');});
 for(var i=0;i<3;i++)$('mg'+i).className='mg'+(i===m?'':' hid');
 var F=[[['I','= U / R'],['R','= R₀(1 + α·ΔT)'],['α','= ΔR / (R₂₀·ΔT)']],[['m','= k·I·t'],['k','= m / (I·t)'],['k₀','= 0.329 mg/C']],[['I','= q·n·v·S'],['U_b','= (U₁ + U₂) / 2'],['δ','= |x − x₀| / x₀']]][m];
 $('fbox').innerHTML=F.map(function(r){return '<div class="fr"><span class="fl">'+r[0]+'</span><span class="fe">'+r[1]+'</span></div>';}).join('');
 var L=T('cl')[m];for(var j=0;j<3;j++)$('rl'+j).textContent=L[j];
 $('gt').textContent=T('gt')[m];table();upd();}
function resetM(){rec[mode]=[];mass=0;tsim=0;table();upd();}
['s0U','s0T'].forEach(function(i){$(i).oninput=upd;});
$('mat').onchange=function(){rec[0]=[];table();upd();};
['s1U','s1C'].forEach(function(i){$(i).oninput=function(){mass=0;tsim=0;upd();};});
$('s2U').oninput=upd;
$('ionB').onclick=function(){ION=!ION;upd();};
document.querySelectorAll('.modes .mt').forEach(function(b){b.onclick=function(){setMode(+b.dataset.m);};});
$('startBtn').onclick=function(){var v=gv(),o=live();
 if(mode==0){if(v.U0<=0)return;var Im=o.I*(1+rnd(.003));rec[0].push({T:v.TP,I:Im,R:v.U0/Im});}
 else if(mode==1){if(tsim<5||v.U1<=0)return;var Im=o.I*(1+rnd(.005)),mm=mass*(1+rnd(.01));rec[1].push({I:Im,t:tsim,m:mm,k:mm/(Im*tsim)});mass=0;tsim=0;}
 else{if(v.U2<=0)return;rec[2].push({U:v.U2,I:o.I*(1+rnd(.02)),brk:o.brk});}
 table();upd();};
