<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Qovushqoqlik — Stoks Qonuni</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap');
:root{--bg:#07090f;--panel:#0e1420;--border:#1b2840;--accent:#34d399;--green:#6fff5c;--blue:#60a5fa;--yellow:#ffc947;--red:#f87171;--text:#dde6f5;--muted:#4a6080;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;}
header{display:flex;align-items:center;gap:10px;padding:8px 18px;border-bottom:1px solid var(--border);background:linear-gradient(90deg,#07090f,#001a0e,#07090f);flex-shrink:0;}
.badge{background:var(--accent);color:#000;font-family:'Space Mono',monospace;font-size:9px;font-weight:700;padding:3px 9px;letter-spacing:2px;border-radius:2px;}
.htitle{font-size:13px;font-weight:800;}.htitle span{color:var(--accent);}
.hsub{font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);margin-left:auto;}
.brand{display:flex;align-items:center;gap:5px;background:linear-gradient(135deg,rgba(52,211,153,.12),rgba(111,255,92,.08));border:1px solid rgba(52,211,153,.3);border-radius:20px;padding:3px 12px;margin-left:8px;flex-shrink:0;}
.brand-txt{font-family:'Space Mono',monospace;font-size:9px;font-weight:700;background:linear-gradient(90deg,#34d399,#6fff5c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px;}
/* TIL TUGMALARI */
.lang-btns{display:flex;gap:4px;margin-left:8px;flex-shrink:0;}
.lb{border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--muted);padding:4px 10px;border-radius:5px;font-family:'Space Mono',monospace;font-size:9px;cursor:pointer;transition:all .2s;font-weight:400;}
.lb.on{background:rgba(52,211,153,.15);border-color:var(--accent);color:var(--accent);font-weight:700;}
.statusbar{background:#0a0f1c;border-bottom:1px solid var(--border);padding:5px 18px;display:flex;align-items:center;gap:12px;font-family:'Space Mono',monospace;font-size:11px;flex-shrink:0;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:bl 1.2s infinite;flex-shrink:0;}
.dot.off{background:var(--muted);animation:none;}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.2}}
#statusTxt{color:var(--accent);}
.chips{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap;}
.chip{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.2);border-radius:10px;padding:2px 8px;font-size:10px;color:var(--muted);}
.chip span{color:var(--accent);}
.body{display:grid;grid-template-columns:230px 1fr;flex:1;overflow:hidden;}
.left{background:var(--panel);border-right:1px solid var(--border);overflow-y:auto;padding:13px;display:flex;flex-direction:column;gap:8px;}
.stitle{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:3px;}
.card{background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:8px;padding:10px;}
.card label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px;}
.vb{font-family:'Space Mono',monospace;font-size:11px;color:var(--accent);background:rgba(52,211,153,.12);padding:2px 7px;border-radius:3px;}
input[type=range]{width:100%;-webkit-appearance:none;height:4px;background:var(--border);border-radius:2px;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--accent);border-radius:50%;cursor:pointer;box-shadow:0 0 8px rgba(52,211,153,.7);}
select{width:100%;background:#0e1420;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 8px;font-family:'Space Mono',monospace;font-size:10px;cursor:pointer;outline:none;}
select option{background:#0e1420;}
.fbox{background:rgba(52,211,153,.04);border:1px solid rgba(52,211,153,.15);border-radius:7px;padding:9px;}
.frow{font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);margin-bottom:4px;display:flex;gap:4px;}
.frow span{color:var(--accent);}
.steps{display:flex;flex-direction:column;gap:3px;}
.step{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:5px;font-size:10px;color:var(--muted);border:1px solid transparent;transition:all .3s;}
.step.active{background:rgba(52,211,153,.07);border-color:rgba(52,211,153,.2);color:var(--accent);}
.step.done{color:var(--green);}
.snum{font-family:'Space Mono',monospace;font-size:9px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);flex-shrink:0;}
.step.active .snum{background:rgba(52,211,153,.2);}
.step.done .snum{background:rgba(111,255,92,.12);color:var(--green);}
.btn{width:100%;padding:9px;border:none;border-radius:7px;font-family:'Syne',sans-serif;font-weight:700;font-size:12px;cursor:pointer;transition:all .2s;margin-top:4px;}
.btn-p{background:linear-gradient(135deg,#34d399,#059669);color:#000;}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 5px 18px rgba(52,211,153,.4);}
.btn-p:disabled{opacity:.35;cursor:not-allowed;transform:none;}
.btn-g{background:linear-gradient(135deg,#6fff5c,#33cc22);color:#000;}
.btn-g:disabled{opacity:.35;}
.btn-r{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--border);font-size:11px;}
.res-box{background:rgba(52,211,153,.05);border:1px solid rgba(52,211,153,.2);border-radius:8px;padding:10px;}
.res-row{display:flex;justify-content:space-between;margin-bottom:5px;font-family:'Space Mono',monospace;font-size:10px;}
.res-row span:first-child{color:var(--muted);}
.center{position:relative;overflow:hidden;background:#020609;}
#simCanvas{display:block;width:100%;height:100%;}
.instr-bar{position:absolute;bottom:0;left:0;right:0;background:rgba(2,6,9,.92);border-top:1px solid var(--border);padding:5px 18px;font-size:10px;color:var(--muted);text-align:center;}
table{width:100%;border-collapse:collapse;font-family:'Space Mono',monospace;font-size:9px;}
th{color:var(--accent);font-size:7px;letter-spacing:1px;border-bottom:1px solid var(--border);padding:4px 2px;text-align:center;}
td{padding:3px 2px;border-bottom:1px solid rgba(255,255,255,.03);text-align:center;}
</style>
</head>
<body>

<!-- BOSHLASH EKRANI -->
<div id="startScreen" style="position:fixed;inset:0;z-index:9999;background:radial-gradient(ellipse at 50% 40%,#001a0e 0%,#07090f 70%);display:flex;align-items:center;justify-content:center;">
  <canvas id="bgCanvas" style="position:absolute;inset:0;width:100%;height:100%;opacity:.4;pointer-events:none"></canvas>
  <div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:16px;max-width:580px;padding:20px;text-align:center;">

    <!-- Til tanlash -->
    <div style="display:flex;gap:8px;">
      <button onclick="setStartLang('uz')" id="slUZ" style="background:rgba(52,211,153,.2);border:1px solid #34d399;color:#34d399;padding:5px 16px;border-radius:6px;font-family:'Space Mono',monospace;font-size:10px;cursor:pointer;font-weight:700;">🇺🇿 UZ</button>
      <button onclick="setStartLang('ru')" id="slRU" style="background:rgba(255,255,255,.04);border:1px solid #1b2840;color:#4a6080;padding:5px 16px;border-radius:6px;font-family:'Space Mono',monospace;font-size:10px;cursor:pointer;">🇷🇺 RU</button>
      <button onclick="setStartLang('en')" id="slEN" style="background:rgba(255,255,255,.04);border:1px solid #1b2840;color:#4a6080;padding:5px 16px;border-radius:6px;font-family:'Space Mono',monospace;font-size:10px;cursor:pointer;">🇬🇧 EN</button>
    </div>

    <div style="display:flex;align-items:center;gap:10px;">
      <div style="background:#34d399;color:#000;font-family:'Space Mono',monospace;font-size:10px;font-weight:700;padding:4px 14px;letter-spacing:2px;border-radius:2px;">МОЛ-ФИЗ · LAB 03</div>
      <div id="ss_sub" style="font-family:'Space Mono',monospace;font-size:10px;color:#4a6080;"></div>
    </div>

    <div style="width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,rgba(52,211,153,.18),rgba(52,211,153,.02));border:2px solid rgba(52,211,153,.4);display:flex;align-items:center;justify-content:center;box-shadow:0 0 55px rgba(52,211,153,.3);animation:pSt 2.5s ease-in-out infinite;"><span style="font-size:44px;">💧</span></div>

    <h1 style="font-size:20px;font-weight:800;color:#fff;" id="ss_title"></h1>
    <p style="font-size:11px;color:#4a6080;font-family:'Space Mono',monospace;" id="ss_formula">η = 2r²(ρ₁−ρ₂)g / 9v</p>

    <div style="background:rgba(52,211,153,.05);border:1px solid rgba(52,211,153,.15);border-radius:12px;padding:15px;width:100%;text-align:left;">
      <div id="ss_stepTitle" style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:#34d399;margin-bottom:10px;"></div>
      <div id="ss_stepList" style="display:flex;flex-direction:column;gap:7px;"></div>
    </div>

    <button onclick="startLab()" id="ss_btn" style="background:linear-gradient(135deg,#34d399,#059669);color:#000;border:none;border-radius:12px;padding:15px 60px;font-size:15px;font-weight:800;font-family:'Syne',sans-serif;cursor:pointer;box-shadow:0 8px 30px rgba(52,211,153,.35);width:100%;"></button>

    <div style="display:flex;align-items:center;gap:6px;opacity:.6;"><span>🔬</span><span style="font-family:'Space Mono',monospace;font-size:10px;font-weight:700;background:linear-gradient(90deg,#34d399,#6fff5c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px;">Xosiyat Virtual Lab</span></div>
  </div>
</div>
<style>
@keyframes pSt{0%,100%{box-shadow:0 0 55px rgba(52,211,153,.2)}50%{box-shadow:0 0 80px rgba(52,211,153,.5)}}
@keyframes fadeOut{0%{opacity:1}100%{opacity:0;transform:scale(1.04)}}
</style>

<!-- HEADER -->
<header>
  <div class="badge">МОЛ-ФИЗ · LAB 03</div>
  <h1 class="htitle" id="hTitle"><span id="hSpan"></span></h1>
  <div class="hsub" id="hSub"></div>
  <div class="lang-btns">
    <div class="lb on" id="lbUZ" onclick="setLang('uz')">🇺🇿 UZ</div>
    <div class="lb" id="lbRU" onclick="setLang('ru')">🇷🇺 RU</div>
    <div class="lb" id="lbEN" onclick="setLang('en')">🇬🇧 EN</div>
  </div>
  <div class="brand"><span>🔬</span><span class="brand-txt">Xosiyat Virtual Lab</span></div>
</header>

<div class="statusbar">
  <div class="dot off" id="dot"></div>
  <span id="statusTxt"></span>
  <div class="chips">
    <div class="chip" id="chip_r">r=<span id="cR">1.0</span>mm</div>
    <div class="chip" id="chip_l">L=<span id="cL">20</span>sm</div>
    <div class="chip" id="chip_t">t=<span id="cT">—</span>s</div>
    <div class="chip" id="chip_eta">η=<span id="cEta">—</span></div>
    <div class="chip" id="chip_cnt"><span id="chipCnt">0</span></div>
  </div>
</div>

<div class="body">
<!-- CHAP PANEL -->
<div class="left">
  <div class="stitle" id="st_liquid"></div>
  <div class="card">
    <select id="sLiquid" onchange="setLiquid(this.value)">
      <option value="glycerin">🫙 Glitserin (η≈1.49 Pa·s)</option>
      <option value="oil">🛢️ Mashina moyi (η≈0.1 Pa·s)</option>
      <option value="water">💧 Suv (η≈0.001 Pa·s)</option>
      <option value="honey">🍯 Asal (η≈5.0 Pa·s)</option>
    </select>
  </div>

  <div class="stitle" id="st_ball"></div>
  <div class="card">
    <select id="sBall" onchange="setBall(this.value)">
      <option value="steel">⚙️ Po'lat (ρ=7800 kg/m³)</option>
      <option value="lead">🔵 Qo'rg'oshin (ρ=11340 kg/m³)</option>
      <option value="glass">⚪ Shisha (ρ=2500 kg/m³)</option>
      <option value="rubber">🟤 Rezina (ρ=1200 kg/m³)</option>
    </select>
  </div>

  <div class="stitle" id="st_radius"></div>
  <div class="card">
    <label id="lbl_r">r (mm) <span class="vb" id="dR">1.0 mm</span></label>
    <input type="range" id="sR" min="0.5" max="5" step="0.5" value="1" oninput="setR(this.value)">
  </div>

  <div class="stitle" id="st_dist"></div>
  <div class="card">
    <label id="lbl_l">L (sm) <span class="vb" id="dL">20 sm</span></label>
    <input type="range" id="sL" min="5" max="40" step="5" value="20" oninput="setLv(this.value)">
  </div>

  <div class="res-box">
    <div class="stitle" id="st_results" style="margin-bottom:6px;"></div>
    <div class="res-row"><span id="r_v_lbl"></span><span id="rV" style="color:var(--blue);">—</span></div>
    <div class="res-row"><span id="r_Re_lbl"></span><span id="rRe" style="color:var(--yellow);">—</span></div>
    <div class="res-row"><span id="r_F_lbl"></span><span id="rF" style="color:var(--accent);">—</span></div>
    <div class="res-row"><span id="r_eta_lbl"></span><span id="rEta" style="color:var(--green);font-size:13px;font-weight:800;">—</span></div>
    <div class="res-row"><span id="r_etanaz_lbl"></span><span id="rEtaNaz" style="color:var(--muted);">—</span></div>
    <div class="res-row"><span id="r_err_lbl"></span><span id="rErr" style="color:var(--red);">—</span></div>
  </div>

  <div class="fbox">
    <div class="frow"><span id="f1"></span></div>
    <div class="frow"><span id="f2"></span></div>
    <div class="frow"><span id="f3"></span></div>
    <div class="frow"><span id="f4"></span></div>
    <div class="frow"><span id="f5"></span></div>
  </div>

  <div class="steps">
    <div class="step active" id="st1"><div class="snum" id="sn1">1</div><span id="step1_txt"></span></div>
    <div class="step" id="st2"><div class="snum" id="sn2">2</div><span id="step2_txt"></span></div>
    <div class="step" id="st3"><div class="snum" id="sn3">3</div><span id="step3_txt"></span></div>
    <div class="step" id="st4"><div class="snum" id="sn4">4</div><span id="step4_txt"></span></div>
    <div class="step" id="st5"><div class="snum" id="sn5">5</div><span id="step5_txt"></span></div>
  </div>

  <button class="btn btn-p" id="runBtn" onclick="runExp()"><span id="btn_run_txt"></span></button>
  <button class="btn btn-g" id="addBtn" onclick="addMeas()" disabled><span id="btn_add_txt"></span></button>
  <button class="btn btn-r" onclick="resetAll()"><span id="btn_reset_txt"></span></button>
</div>

<!-- MARKAZ -->
<div class="center">
  <canvas id="simCanvas"></canvas>
  <div class="instr-bar" id="instrBar"></div>
</div>
</div>

<div style="position:fixed;bottom:14px;right:18px;display:flex;align-items:center;gap:7px;background:rgba(7,9,15,.75);border:1px solid rgba(52,211,153,.2);border-radius:30px;padding:5px 16px;backdrop-filter:blur(10px);z-index:9999;pointer-events:none;">
  <span>🔬</span><span style="font-family:'Space Mono',monospace;font-size:11px;font-weight:700;background:linear-gradient(90deg,#34d399,#6fff5c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px;">Xosiyat Virtual Lab</span>
</div>

// ========== FIZIKA ==========
function setLiquid(v){liquidKey=v; upd();}
function setBall(v){ballKey=v; upd();}
function setR(v){Rv=parseFloat(v);document.getElementById('dR').textContent=v+' mm';document.getElementById('cR').textContent=v; upd();}
function setLv(v){Lv=parseFloat(v);document.getElementById('dL').textContent=v+' sm';document.getElementById('cL').textContent=v; upd();}

function calcEta(){
  var liq=LIQUIDS[liquidKey], ball=BALLS[ballKey];
  var r=Rv/1000, g=9.81;
  var rho1=ball.rho, rho2=liq.rho;
  var eta=liq.eta;
  // Terminal tezlik: v = 2r²(ρ1-ρ2)g / (9η)
  var v=2*r*r*(rho1-rho2)*g/(9*eta);
  // t = L/v
  var t=(Lv/100)/Math.max(v,0.0001);
  var Re=rho2*v*2*r/eta;
  var F_stokes=6*Math.PI*eta*r*v;
  return {v:v, t:t, eta:eta, Re:Re, F:F_stokes, rho1:rho1, rho2:rho2};
}

function upd(){
  var c=calcEta();
  document.getElementById('rV').textContent=c.v.toExponential(3)+' m/s';
  document.getElementById('rRe').textContent=c.Re.toExponential(3);
  document.getElementById('rF').textContent=c.F.toExponential(3)+' N';
  document.getElementById('rEtaNaz').textContent=LIQUIDS[liquidKey].eta+' Pa·s';
}

function runExp(){
  if(running) return;
  if(BALLS[ballKey].rho <= LIQUIDS[liquidKey].rho){
    alert(lang==='uz'?'Shar suyuqlikda suzadi! ρ_shar > ρ_suyuqlik bo\'lishi kerak':
          lang==='ru'?'Шарик плавает! ρ_шар должно быть > ρ_жидкости':'Ball floats! ρ_ball must be > ρ_liquid');
    return;
  }
  running=true; done=false; simT=0; ballY=0; lastResult=null;
  document.getElementById('runBtn').disabled=true;
  document.getElementById('dot').classList.remove('off');
  document.getElementById('statusTxt').textContent=TR[lang].statusRun;
  setStep(2);
}

var physT=0;
(function loop(){
  animT+=0.016;
  if(running){
    var c=calcEta();
    var tReal=c.t;
    physT+=0.016;
    ballY=Math.min(physT/tReal, 1);
    if(physT>=tReal){
      running=false; done=true;
      var tMeas=tReal*(1+(Math.random()-.5)*0.02);
      var etaExp=2*(Rv/1000)*(Rv/1000)*(BALLS[ballKey].rho-LIQUIDS[liquidKey].rho)*9.81/(9*(c.v+(Math.random()-.5)*c.v*0.01));
      var eps=Math.abs(etaExp-LIQUIDS[liquidKey].eta)/LIQUIDS[liquidKey].eta*100;
      lastResult={t:tMeas, v:Lv/100/tMeas, eta:etaExp, etaNaz:LIQUIDS[liquidKey].eta, Re:c.Re, F:c.F, eps:eps};
      document.getElementById('rV').textContent=(Lv/100/tMeas).toExponential(3)+' m/s';
      document.getElementById('rEta').textContent=etaExp.toFixed(4)+' Pa·s';
      document.getElementById('rErr').textContent=eps.toFixed(2)+'%';
      document.getElementById('rRe').textContent=c.Re.toExponential(3)+(c.Re<0.5?' ✅':' ⚠️');
      document.getElementById('cT').textContent=tMeas.toFixed(2);
      document.getElementById('cEta').textContent=etaExp.toFixed(4);
      document.getElementById('runBtn').disabled=false;
      document.getElementById('addBtn').disabled=false;
      document.getElementById('dot').classList.add('off');
      setStep(4);
      document.getElementById('statusTxt').textContent=TR[lang].statusDone+' | t='+tMeas.toFixed(3)+'s | η='+etaExp.toFixed(4)+' Pa·s | ε='+eps.toFixed(2)+'%';
      physT=0;
    }
  }
  drawSim();
  requestAnimationFrame(loop);
})();

function drawSim(){
  var W=sc.width, H=sc.height;
  if(!W||!H) return;
  ctx.clearRect(0,0,W,H);

  var liq=LIQUIDS[liquidKey], ball=BALLS[ballKey];
  var tubW=Math.min(W*0.28,180), tubH=H*0.78;
  var tubX=W*0.35, tubY=H*0.11;

  // Fon
  ctx.fillStyle='#020609'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(52,211,153,.02)'; ctx.lineWidth=1;
  for(var xi=0;xi<W;xi+=50){ctx.beginPath();ctx.moveTo(xi,0);ctx.lineTo(xi,H);ctx.stroke();}
  for(var yi=0;yi<H;yi+=50){ctx.beginPath();ctx.moveTo(0,yi);ctx.lineTo(W,yi);ctx.stroke();}

  // Idish soya
  ctx.shadowColor='rgba(52,211,153,.15)'; ctx.shadowBlur=20;

  // Suyuqlik
  ctx.fillStyle=liq.color;
  rr(ctx, tubX, tubY+10, tubW, tubH-10, 0);
  ctx.fill();

  // Idish chegarasi
  ctx.strokeStyle='rgba(200,230,220,.5)'; ctx.lineWidth=3;
  ctx.shadowBlur=0;
  rr(ctx, tubX, tubY, tubW, tubH, 6);
  ctx.stroke();

  // Idish ichki yaltiroq
  ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.lineWidth=1;
  rr(ctx, tubX+4, tubY+4, tubW-8, tubH-8, 4);
  ctx.stroke();

  // Suyuqlik to'lqin animatsiyasi (yuqori sirt)
  ctx.strokeStyle='rgba(255,255,255,.2)'; ctx.lineWidth=1;
  ctx.beginPath();
  for(var xi=tubX;xi<tubX+tubW;xi+=3){
    var yy=tubY+10+Math.sin((xi-tubX)*0.15+animT*2)*3;
    if(xi===tubX) ctx.moveTo(xi,yy); else ctx.lineTo(xi,yy);
  }
  ctx.stroke();

  // L masofasi belgilar
  var measTop=tubY+tubH*0.15;
  var measBot=tubY+tubH*0.15+Lv/40*tubH*0.7;
  ctx.strokeStyle='rgba(255,201,71,.5)'; ctx.lineWidth=1.5; ctx.setLineDash([4,6]);
  ctx.beginPath();ctx.moveTo(tubX+tubW+10,measTop);ctx.lineTo(tubX+tubW+10,measBot);ctx.stroke();
  ctx.setLineDash([]);
  arrV(tubX+tubW+10,measTop,-1,'rgba(255,201,71,.6)');
  arrV(tubX+tubW+10,measBot,1,'rgba(255,201,71,.6)');
  ctx.fillStyle='rgba(255,201,71,.7)'; ctx.font='10px Space Mono'; ctx.textAlign='left';
  ctx.fillText('L='+Lv+'sm',tubX+tubW+16,(measTop+measBot)/2+3);

  // Shkala (chap tomon)
  ctx.strokeStyle='rgba(52,211,153,.3)'; ctx.lineWidth=1;
  for(var si=0;si<=10;si++){
    var sy=tubY+si*tubH/10;
    ctx.beginPath();ctx.moveTo(tubX-15,sy);ctx.lineTo(tubX-5,sy);ctx.stroke();
    ctx.fillStyle='rgba(52,211,153,.4)'; ctx.font='7px monospace'; ctx.textAlign='right';
    ctx.fillText((si*10)+'%',tubX-18,sy+3);
  }

  // SHAR
  var ballR=Math.min(Rv*8, tubW*0.22);
  var ballXc=tubX+tubW/2;
  var ballTopY=tubY+ballR*1.5;
  var ballBotY=tubY+tubH-ballR*1.5;
  var ballCY=ballTopY+(ballBotY-ballTopY)*ballY;

  // Iz (trail)
  if(ballY>0.02){
    var trailLen=ballY*(ballBotY-ballTopY);
    var trailGr=ctx.createLinearGradient(ballXc,ballTopY,ballXc,ballCY);
    trailGr.addColorStop(0,'rgba(52,211,153,0)');
    trailGr.addColorStop(1,'rgba(52,211,153,.15)');
    ctx.fillStyle=trailGr;
    ctx.fillRect(ballXc-ballR*0.3,ballTopY,ballR*0.6,trailLen);
  }

  // Kuch vektorlari (harakatda)
  if(running&&ballY>0.05){
    var c2=calcEta();
    // mg pastga
    ctx.strokeStyle='rgba(248,113,113,.8)'; ctx.lineWidth=2; ctx.shadowColor='rgba(248,113,113,.4)'; ctx.shadowBlur=8;
    ctx.beginPath();ctx.moveTo(ballXc,ballCY+ballR);ctx.lineTo(ballXc,ballCY+ballR+40);ctx.stroke();
    arrV(ballXc,ballCY+ballR+40,1,'rgba(248,113,113,.8)');
    ctx.fillStyle='rgba(248,113,113,.7)'; ctx.font='9px monospace'; ctx.textAlign='left';
    ctx.fillText('mg',ballXc+4,ballCY+ballR+28);
    // F_arximed yuqoriga
    ctx.strokeStyle='rgba(96,165,250,.8)'; ctx.lineWidth=2; ctx.shadowColor='rgba(96,165,250,.4)'; ctx.shadowBlur=8;
    ctx.beginPath();ctx.moveTo(ballXc,ballCY-ballR);ctx.lineTo(ballXc,ballCY-ballR-25);ctx.stroke();
    arrV(ballXc,ballCY-ballR-25,-1,'rgba(96,165,250,.8)');
    ctx.fillStyle='rgba(96,165,250,.7)'; ctx.font='8px monospace'; ctx.textAlign='left';
    ctx.fillText('Farx',ballXc+4,ballCY-ballR-12);
    // F_stoks yuqoriga
    ctx.strokeStyle='rgba(52,211,153,.8)'; ctx.lineWidth=2; ctx.shadowColor='rgba(52,211,153,.4)'; ctx.shadowBlur=8;
    ctx.beginPath();ctx.moveTo(ballXc-8,ballCY-ballR);ctx.lineTo(ballXc-8,ballCY-ballR-18);ctx.stroke();
    arrV(ballXc-8,ballCY-ballR-18,-1,'rgba(52,211,153,.8)');
    ctx.fillStyle='rgba(52,211,153,.7)'; ctx.font='8px monospace'; ctx.textAlign='right';
    ctx.fillText('FStr',ballXc-12,ballCY-ballR-8);
    ctx.shadowBlur=0;
  }

  // Shar
  var bg=ctx.createRadialGradient(ballXc-ballR*0.35,ballCY-ballR*0.35,ballR*0.05,ballXc,ballCY,ballR);
  bg.addColorStop(0,'rgba(255,255,255,.3)');
  bg.addColorStop(0.3,ball.color);
  bg.addColorStop(1,'rgba(0,0,0,.4)');
  ctx.shadowColor='rgba(52,211,153,.4)'; ctx.shadowBlur=15;
  ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(ballXc,ballCY,ballR,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(52,211,153,.6)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(ballXc,ballCY,ballR,0,Math.PI*2); ctx.stroke();
  ctx.shadowBlur=0;

  // Tezlik ko'rsatgich
  if(running&&ballY>0.1){
    var c3=calcEta();
    var vNorm=Math.min(c3.v*5,1);
    ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(ballXc+ballR+4,ballCY);ctx.lineTo(ballXc+ballR+4+vNorm*25,ballCY);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.4)'; ctx.font='7px monospace'; ctx.textAlign='left';
    ctx.fillText('v='+c3.v.toExponential(2),ballXc+ballR+6,ballCY-6);
  }

  // Suyuqlik nomi
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='bold 11px Syne'; ctx.textAlign='center';
  ctx.fillText(TR[lang].liquids[liquidKey]||liquidKey, tubX+tubW/2, tubY+tubH-10);

  // t vaqt progressi
  if(running){
    var c4=calcEta();
    var prog=Math.min(physT/c4.t,1);
    ctx.fillStyle='rgba(14,20,32,.85)'; rr(ctx,tubX,tubY-35,tubW,24,5); ctx.fill();
    ctx.fillStyle='rgba(52,211,153,.4)'; rr(ctx,tubX,tubY-35,tubW*prog,24,5); ctx.fill();
    ctx.strokeStyle='rgba(52,211,153,.3)'; ctx.lineWidth=1; rr(ctx,tubX,tubY-35,tubW,24,5); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.8)'; ctx.font='bold 10px Space Mono'; ctx.textAlign='center';
    ctx.fillText('t = '+physT.toFixed(2)+' s',tubX+tubW/2,tubY-18);
  }

}

function arrV(x,y,d,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-5,y+d*10);ctx.lineTo(x+5,y+d*10);ctx.closePath();ctx.fill();}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
</script>
